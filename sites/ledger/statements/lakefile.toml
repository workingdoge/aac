name = "aac-verification"
defaultTargets = ["AAC"]

# Pinned to the v4.28.0 mathlib tag (commit 8f9d9cff). The exact resolved
# dependency graph is committed in lake-manifest.json; reproduce with:
#   lake exe cache get   # pulls prebuilt mathlib oleans (minutes, not hours)
#   lake build           # elaborates Core.lean — the only thing built here
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "AAC"
srcDir = "."
roots = ["Core"]
