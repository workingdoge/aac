<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AAC — proof-native double-entry accounting">
  <title>AAC cover</title>
  <defs>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#15161a" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Paper -->
  <rect width="1200" height="630" fill="#f7f5ef"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Faint oversized mark motif, bleeding off the right edge -->
  <g transform="translate(842,150) scale(1.62)" opacity="0.06">
    <rect x="71"  y="96" width="30" height="22" rx="7" fill="#15161a"/>
    <rect x="113" y="96" width="30" height="22" rx="7" fill="#15161a"/>
    <rect x="155" y="96" width="30" height="22" rx="7" fill="#15161a"/>
    <rect x="71"  y="138" width="30" height="22" rx="7" fill="#15161a"/>
    <rect x="113" y="138" width="30" height="22" rx="7" fill="#15161a"/>
    <rect x="155" y="138" width="30" height="22" rx="7" fill="#15161a"/>
  </g>

  <!-- Mark -->
  <g transform="translate(96,74) scale(0.5)">
    <rect x="16" y="16" width="224" height="224" rx="52" fill="#15161a"/>
    <rect x="71"  y="96" width="30" height="22" rx="7" fill="#f7f5ef"/>
    <rect x="113" y="96" width="30" height="22" rx="7" fill="#f7f5ef"/>
    <rect x="155" y="96" width="30" height="22" rx="7" fill="#f7f5ef"/>
    <rect x="71"  y="138" width="30" height="22" rx="7" fill="#1f9d63"/>
    <rect x="113" y="138" width="30" height="22" rx="7" fill="#1f9d63"/>
    <rect x="155" y="138" width="30" height="22" rx="7" fill="#1f9d63"/>
  </g>

  <!-- Eyebrow -->
  <text x="236" y="142" font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="19" letter-spacing="5" fill="#6c6e76">AMERICAN ACCOUNTING COMPANY</text>
  <rect x="236" y="158" width="56" height="3" rx="1.5" fill="#1f9d63"/>

  <!-- Wordmark -->
  <text x="92" y="392" font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="168" font-weight="700" letter-spacing="6" fill="#15161a">AAC</text>

  <!-- Tagline -->
  <text x="98" y="462" font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="40" font-weight="600" fill="#15161a">Balance is a proof, not a promise.</text>

  <!-- Sub -->
  <text x="98" y="506" font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="23" fill="#6c6e76">proof-native double-entry accounting</text>

  <!-- Emerald rule -->
  <rect x="98" y="534" width="190" height="4" rx="2" fill="#1f9d63"/>

  <!-- Faint formula, bottom-right -->
  <text x="1104" y="582" text-anchor="end" font-family="'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="27" fill="#15161a" fill-opacity="0.22">&#931; debit  &#8722;  &#931; credit  =  0   &#8712;  K(M)</text>
</svg>
